# hydroflux workspace
#
# Cada componente del solver (1D, 2D, coupling, …) es su propio crate.
# Ver outline.md § "Convenciones" en CLAUDE.md.

[workspace]
resolver = "3"
members = [
    "autograd",
    "solver-1d",
    "solver-2d",
]

[workspace.package]
edition       = "2024"
rust-version  = "1.85"
authors       = ["Francisco Parra <francisco.parra.o@usach.cl>"]
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/franciscoparrao/hydroflux"
description   = "Differentiable, GPU-native, coupled hydrometeorological hazard solver in Rust"
keywords      = ["hydraulics", "shallow-water", "flood", "differentiable", "gis"]
categories    = ["science::geo", "simulation"]

[workspace.dependencies]
ndarray = "0.16"
approx  = "0.5"
thiserror = "2"
tempfile = "3"
criterion = "0.5"
proptest = "1"
flate2 = "1"
# Internal workspace members exposed as deps to siblings.
hydroflux-autograd = { path = "autograd" }
# SurtGIS pinned by commit so a fresh clone builds with cargo alone —
# the path-dependency era broke the exact commands printed in the
# paper's Open Research section (audit 2026-07, §2.4/WP2). Keep this
# rev in sync with SURTGIS_REF in .github/workflows/ci.yml. To iterate
# against a local surtgis checkout temporarily, swap in
#   surtgis-core = { path = "../../surtgis/crates/core" }
# but never commit that state.
surtgis-core = { git = "https://github.com/franciscoparrao/surtgis", rev = "7348ac2b7642d43f800d6d3d7a7eed5b1577edec" }
