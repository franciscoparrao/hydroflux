# hydroflux workspace
#
# Cada componente del solver (1D, 2D, coupling, …) es su propio crate.
# Ver outline.md § "Convenciones" en CLAUDE.md.

[workspace]
resolver = "3"
members = [
    "solver-1d",
    "solver-2d",
]

[workspace.package]
edition       = "2024"
rust-version  = "1.85"
authors       = ["Francisco Parra <francisco.parra.o@usach.cl>"]
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/franciscoparrao/hydroflux"
description   = "Differentiable, GPU-native, coupled hydrometeorological hazard solver in Rust"
keywords      = ["hydraulics", "shallow-water", "flood", "differentiable", "gis"]
categories    = ["science::geo", "simulation"]

[workspace.dependencies]
ndarray = "0.16"
approx  = "0.5"
thiserror = "2"
tempfile = "3"
# SurtGIS path dependency. Mientras seamos el único dev, path dep está bien.
# Antes del primer release público (Q4 2026) migrar a git dep con tag fijo
# para que terceros puedan compilar sin clonar surtgis manualmente.
surtgis-core = { path = "../../surtgis/crates/core" }
