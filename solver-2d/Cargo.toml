[package]
name        = "hydroflux-solver-2d"
version     = "0.1.0-dev"
description = "2D shallow-water solver: structured Cartesian + HLLC Riemann + Audusse well-balanced + Manning friction"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
ndarray.workspace            = true
thiserror.workspace          = true
surtgis-core.workspace       = true
hydroflux-autograd.workspace = true
flate2.workspace             = true
rayon = { workspace = true, optional = true }

[features]
# Row-chunked rayon parallelism over the step's per-cell passes (WP4,
# 2026-07). Off by default: single-threaded is the reproducible,
# zero-dependency-surprise default for the verification suite and for
# anyone building the paper's exact numbers. See
# `src/parallel.rs` for the `T: Send + Sync` bound this gates.
parallel = ["dep:rayon", "ndarray/rayon"]

[dev-dependencies]
approx.workspace    = true
tempfile.workspace  = true
criterion.workspace = true

[[bench]]
name    = "step"
harness = false
