# CI del workspace hydroflux.
#
# surtgis-core llega como git-dependency pinneada por rev en el
# Cargo.toml raíz (misma razón que el pin que antes vivía aquí: el
# drift silencioso de surtgis ya rompió los tests de io — band index
# 1-based → 0-based, 2026-07-02 — y el pin convierte ese modo de falla
# en un bump explícito y revisable). El CI corre exactamente lo que un
# reviewer obtiene con `git clone` + cargo: si esto pasa, el claim de
# reproducibilidad del paper (§Open Research) se sostiene.
#
# Al bumpear surtgis: actualizar el `rev` en Cargo.toml (único lugar).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Los tests numéricos corren en release: los benchmarks de
      # integración (UK EA, Thacker, MacDonald 2D) son prohibitivos
      # en debug y las tolerancias están calibradas con optimización.
      - name: Test (workspace, release)
        run: cargo test --workspace --release

      - name: Verification gate (analytical benchmarks, exits 1 on FAIL)
        run: cargo run --release -p hydroflux-autograd --example verify_swe1d_solver

      # Informativos por ahora: el árbol tiene warnings de clippy en
      # examples y diffs de fmt en archivos en hold por el paper 02.
      # Promover a bloqueantes (-D warnings / --check duro) cuando se
      # limpien (auditoría 2026-07, §2.6).
      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets || true

      - name: Format check (informational)
        run: cargo fmt --check || true
