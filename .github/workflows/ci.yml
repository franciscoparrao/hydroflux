# CI del workspace hydroflux.
#
# Peculiaridad del layout: el workspace depende de surtgis-core por PATH
# (`../../surtgis/crates/core`, ver Cargo.toml raíz). Para reproducir esa
# ruta relativa en CI, hydroflux se clona en `postdoc/hydroflux/` y
# surtgis en `surtgis/`, pinneado a un commit exacto. El pin se sube a
# mano, deliberadamente: el drift silencioso de surtgis ya rompió los
# tests de io (band index 1-based → 0-based, 2026-07-02); el pin convierte
# ese modo de falla en un bump explícito y revisable. Migrar a git-dep
# con tag antes del release público v0.1 (plan: outline.md Fase 3).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Commit de surtgis contra el que este workspace compila y pasa.
  # Incluye el Sprint 1 de correctness (band 0-based, nodata→NaN).
  SURTGIS_REF: 7348ac2b7642d43f800d6d3d7a7eed5b1577edec

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: postdoc/hydroflux
    steps:
      - name: Checkout hydroflux
        uses: actions/checkout@v4
        with:
          path: postdoc/hydroflux

      - name: Checkout surtgis (path dependency, pinned)
        uses: actions/checkout@v4
        with:
          repository: franciscoparrao/surtgis
          ref: ${{ env.SURTGIS_REF }}
          path: surtgis

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: postdoc/hydroflux

      # Los tests numéricos corren en release: los benchmarks de
      # integración (UK EA, Thacker, MacDonald 2D) son prohibitivos
      # en debug y las tolerancias están calibradas con optimización.
      - name: Test (workspace, release)
        run: cargo test --workspace --release

      - name: Verification gate (analytical benchmarks, exits 1 on FAIL)
        run: cargo run --release -p hydroflux-autograd --example verify_swe1d_solver

      # Informativos por ahora: el árbol tiene warnings de clippy en
      # examples y diffs de fmt en archivos en hold por el paper 02.
      # Promover a bloqueantes (-D warnings / --check duro) cuando se
      # limpien (auditoría 2026-07, §2.6).
      - name: Clippy (informational)
        run: cargo clippy --workspace --all-targets || true

      - name: Format check (informational)
        run: cargo fmt --check || true
